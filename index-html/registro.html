    <link rel="stylesheet" href="resgitro.css">

    <style>

    </style>

</head>

<body>


    <!-- HEADER -->

    <header>

        <a href="../index.html" class="logo">

            <div class="logo-icon">
                N
            </div>

            <div>
                <h2>INNOVART</h2>
                <span>DIGITAL</span>
            </div>

        </a>


        <nav>

            <a href="../index.html">
                INICIO
            </a>

            <a href="nosotros.html">
                NOSOTROS
            </a>

            <a href="servicios.html">
                SERVICIOS
            </a>

            <a href="agenda.html">

                Iniciar sesión
            </a>

            <a href="registro.html" class="btn-register">
                Registrarse
            </a>

        </nav>

    </header>


    <!-- REGISTRO -->

    <main class="auth-section">

        <div class="auth-card">

            <div class="auth-title">

                <h1>
                    Crear cuenta
                </h1>

                <p>
                    Regístrate para solicitar nuestros servicios
                </p>

            </div>


            <form id="registroForm">


                <div class="form-row">

                    <div class="form-group">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Tu nombre"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="apellido">
                            Apellido
                        </label>

                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Tu apellido"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="telefono">
                        Teléfono
                    </label>

                    <input
                        type="tel"
                        id="telefono"
                        name="telefono"
                        placeholder="300 000 0000"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="password">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Contraseña"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Repite la contraseña"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Crear cuenta
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    ¿Ya tienes una cuenta?
                    <a href="login.html">
                        Iniciar sesión
                    </a>
                </p>

            </div>

        </div>

    </main>


    <footer>
