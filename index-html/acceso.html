<!DOCTYPE html>
<html lang="es">

<head>

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Innovart Digital</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="acceso.css">

</head>

    <style>

    </style>

</head>

<body>


    <!-- HEADER -->

    <header>

        <a href="../index.html" class="logo">     <!--preguntar porque tengo ese link -->

            <div class="logo-icon">
                N
            </div>

            <div>
                <h2>INNOVART</h2>
                <span>DIGITAL</span>
            </div>

        </a>


        <nav>

            <a href="../index.html">
                INICIO
            </a>

            <a href="nosotros.html">
                NOSOTROS
            </a>

            <a href="servicios.html">
                SERVICIOS
            </a>

            <a href="agenda.html">
                AGENDA
            </a>

            <a href="contacto.html">
                CONTACTO
            </a>

            <a href="login.html" class="btn-login">
                Iniciar sesión
            </a>

            <a href="registro.html" class="btn-register">
                Registrarse
            </a>

        </nav>

    </header>


    <!-- LOGIN -->

    <main class="auth-section">

        <div class="auth-card">

            <div class="auth-title">

                <h1>
                    Iniciar sesión
                </h1>

                <p>
                    Ingresa a tu cuenta de Innovart Digital
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="correo">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="ejemplo@correo.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Iniciar sesión
                </button>

            </form>


            <div class="auth-footer">

                <p>
                    ¿No tienes una cuenta?
                    <a href="registro.html">
                        Regístrate
                    </a>
                </p>

            </div>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>

        <div class="copyright">

            <span>
                © 2026 Innovart Digital.
                Todos los derechos reservados.
            </span>

        </div>

    </footer>


    <script src="../js/main.js"></script>

</body>

</html>
